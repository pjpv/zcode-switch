[package]
name = "zcode-switch"
version = "1.7.0-beta.1"
description = "ZCode 账号切换器"
license = "MIT"
edition = "2021"

[lib]
name = "zcode_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# zcode.z.ai 由阿里云 ESA WAF 前置，会对 rustls 的 TLS 指纹静默降级（返回空 payload /
# 连接超时），导致活动额度 preview/claim/激活上报全部拿不到数据。
# native-tls 在 Windows 上走 Schannel，指纹与系统客户端一致，可正常通过。
# 注意：ureq 的 native-tls 特性不会自动成为默认后端，必须在每个 AgentBuilder 上
# 显式调用 .tls_connector(...)（见 quota::native_tls_connector）。
ureq = { version = "2", features = ["json", "native-tls"] }
native-tls = "0.2"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
percent-encoding = "2"
windows-sys = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
] }

[target.'cfg(not(windows))'.dependencies]
# X-Client-Timezone 的 IANA 名（Node Intl 同源）
iana-time-zone = "0.1"

[profile.release]
strip = "symbols"
lto = "thin"
