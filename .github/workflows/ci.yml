name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ui:
    name: frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:i18n
      - run: npm run build

  test-windows:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test --lib
        working-directory: src-tauri

  check-portability:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        shell: bash
        run: |
          cd src-tauri
          cargo test --lib 2>&1 | tee check.log
          exit ${PIPESTATUS[0]}

      - name: Publish log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name ci-logbot
          git config user.email bot@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rf -q .
          cp src-tauri/check.log "check-${RUNNER_OS}.log"
          git add "check-${RUNNER_OS}.log"
          git commit -qm "ci log ${GITHUB_SHA}"
          git push -q origin HEAD:ci-logs --force
