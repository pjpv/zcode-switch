name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Frontend and i18n checks
        run: |
          npm run build
          npm run check:i18n

      - name: cargo test
        run: cargo test --lib
        working-directory: src-tauri

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib

      - name: Dependency manifests
        run: |
          npm audit --omit=dev --audit-level=high
          cargo install cargo-audit --locked
          cargo audit --manifest-path src-tauri/Cargo.toml

  check-portability:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        shell: bash
        run: |
          cd src-tauri
          cargo test --lib 2>&1 | tee check.log
          exit ${PIPESTATUS[0]}

      - name: Publish log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ runner.os }}
          path: src-tauri/check.log
          retention-days: 7
