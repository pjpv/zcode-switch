name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: macos-latest
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-latest
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Z·SWITCH ${{ github.ref_name }}'
          releaseBody: '见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能。Windows：`*_x64-setup.exe` 安装包（推荐）/ `*_portable.exe` 便携版；macOS：`*_aarch64.dmg`（Apple 芯片）/ `*_x64.dmg`（Intel 芯片）；Linux：`*.deb` / `*.AppImage`。各平台均未签名：Windows SmartScreen 选「更多信息 → 仍要运行」，macOS Gatekeeper 右键打开，Linux AppImage 需 chmod +x。'
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/zcode-switch.exe" "zcode-switch_${VER}_portable.exe"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-switch_${VER}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "zcode-switch_${VER}_portable.exe" "checksums-Windows-${GITHUB_REF_NAME}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGT="${{ matrix.rust_target }}"
          [ -n "$TGT" ] || TGT="native"
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            | xargs sha256sum | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt" --clobber
